services:
  - type: web
    name: telecom-offer-advisor
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # Render terminates public TLS and forwards the original scheme in X-Forwarded-Proto.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: DATABASE_URL
        value: sqlite:///./data/telecom.db
      - key: DEMO_ACCESS_TOKEN
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TEXT_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_STT_MODEL
        value: gpt-4o-mini-transcribe
      - key: OPENAI_TTS_MODEL
        value: gpt-4o-mini-tts
      - key: OPENAI_TTS_VOICE
        value: alloy
